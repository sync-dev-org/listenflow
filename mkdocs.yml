site_name: listenflow
site_description: Engine-neutral streaming speech-to-text contracts and runtime
docs_dir: docs
repo_url: https://github.com/sync-dev-org/listenflow
repo_name: sync-dev-org/listenflow
strict: true

theme:
  name: material
  language: en
  features:
    - navigation.sections

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            members: true
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_if_no_docstring: true
            signature_crossrefs: true

nav:
  - Home: index.md
  - API reference:
      - Engines and health: api/engine.md
      - Complete PCM transcription: api/transcription.md
      - Synchronous helpers: api/sync.md
      - Transcript events: api/events.md
      - Utterance boundaries: api/utterances.md
      - Offline models: api/models.md
